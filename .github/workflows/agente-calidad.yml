name: Agente de control de calidad PettGo

on:
  schedule:
    # Los días 1 y 15 de cada mes a las 13:00 UTC = 10:00 en Chile (horario de verano, UTC-3).
    # En horario de invierno (UTC-4) corre a las 09:00. GitHub solo acepta horas en UTC.
    - cron: "0 13 1,15 * *"
  workflow_dispatch: {}   # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write   # para guardar el último reporte en el repositorio

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # El reporte anterior (reportes/ultimo.json) viene en el repositorio y sirve
      # para marcar qué hallazgos son nuevos respecto de la revisión anterior.
      - name: Ejecutar agente
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # opcional
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}             # opcional
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}                 # opcional
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}         # opcional
        run: python agente_calidad.py

      - name: Guardar el reporte en el repositorio (para comparar la próxima vez)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "agente-calidad-pettgo"
          git config user.email "agente-calidad-pettgo@users.noreply.github.com"
          git add -f reportes/ultimo.json reportes/reporte.html reportes/resumen.md
          git commit -m "Reporte de calidad $(date +%Y-%m-%d)" || echo "Sin cambios"
          git push

      - name: Publicar reporte descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-calidad-${{ github.run_number }}
          path: reportes/
          retention-days: 90
